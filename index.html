<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Second Time by Arpitha Rai — Giving Fabrics a Second Life</title>
    <meta name="description" content="Sustainable fashion studio in Auroville, Tamil Nadu. Transforming pre-loved garments into contemporary, one-of-a-kind pieces." />
    <meta name="keywords" content="sustainable fashion india, upcycled clothing, circular fashion, slow fashion, auroville, upcycled dresses india, eco fashion" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --brand-black: #0a0a0a;
        --brand-red: #8B1A1A;
        --brand-red-light: #A52020;
        --brand-white: #fafafa;
        --brand-cream: #f5f0eb;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: 'Inter', sans-serif;
        color: var(--brand-black);
        background: var(--brand-white);
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .font-serif { font-family: 'Cormorant Garamond', serif !important; }

      /* Scroll reveal */
      .reveal {
        opacity: 0;
        transform: translateY(48px);
        transition: opacity 0.9s cubic-bezier(0.16,1,0.3,1), transform 0.9s cubic-bezier(0.16,1,0.3,1);
      }
      .reveal.visible { opacity: 1; transform: translateY(0); }

      .reveal-left {
        opacity: 0;
        transform: translateX(-48px);
        transition: opacity 0.9s cubic-bezier(0.16,1,0.3,1), transform 0.9s cubic-bezier(0.16,1,0.3,1);
      }
      .reveal-left.visible { opacity: 1; transform: translateX(0); }

      .reveal-right {
        opacity: 0;
        transform: translateX(48px);
        transition: opacity 0.9s cubic-bezier(0.16,1,0.3,1), transform 0.9s cubic-bezier(0.16,1,0.3,1);
      }
      .reveal-right.visible { opacity: 1; transform: translateX(0); }

      .reveal-scale {
        opacity: 0;
        transform: scale(0.92);
        transition: opacity 0.9s cubic-bezier(0.16,1,0.3,1), transform 0.9s cubic-bezier(0.16,1,0.3,1);
      }
      .reveal-scale.visible { opacity: 1; transform: scale(1); }

      /* Delay classes */
      .delay-100 { transition-delay: 0.1s !important; }
      .delay-200 { transition-delay: 0.2s !important; }
      .delay-300 { transition-delay: 0.3s !important; }
      .delay-400 { transition-delay: 0.4s !important; }
      .delay-500 { transition-delay: 0.5s !important; }

      /* Hero animations */
      @keyframes heroFadeUp {
        from { opacity: 0; transform: translateY(60px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes heroFadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes subtlePulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.6; }
      }
      @keyframes threadDraw {
        to { stroke-dashoffset: 0; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes marquee {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
      }

      .hero-text-1 { animation: heroFadeUp 1.2s cubic-bezier(0.16,1,0.3,1) 0.2s both; }
      .hero-text-2 { animation: heroFadeUp 1.2s cubic-bezier(0.16,1,0.3,1) 0.5s both; }
      .hero-text-3 { animation: heroFadeUp 1.2s cubic-bezier(0.16,1,0.3,1) 0.8s both; }
      .hero-btn { animation: heroFadeUp 1.2s cubic-bezier(0.16,1,0.3,1) 1.1s both; }
      .hero-bg { animation: heroFadeIn 2s ease both; }

      .animate-float { animation: float 4s ease-in-out infinite; }
      .animate-spin-slow { animation: spin-slow 20s linear infinite; }
      .animate-marquee { animation: marquee 30s linear infinite; }

      /* Hover underline */
      .hover-underline {
        position: relative;
        display: inline-block;
      }
      .hover-underline::after {
        content: '';
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 0;
        height: 1px;
        background: currentColor;
        transition: width 0.35s cubic-bezier(0.4,0,0.2,1);
      }
      .hover-underline:hover::after { width: 100%; }

      /* Product card */
      .product-card { overflow: hidden; position: relative; cursor: pointer; }
      .product-card .product-img { transition: transform 0.7s cubic-bezier(0.16,1,0.3,1); }
      .product-card:hover .product-img { transform: scale(1.06); }
      .product-card .product-actions {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 1.5rem;
        background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 100%);
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.35s ease, transform 0.35s ease;
      }
      .product-card:hover .product-actions { opacity: 1; transform: translateY(0); }

      /* Nav blur */
      .nav-blur {
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        background: rgba(250,250,250,0.92) !important;
      }
      .nav-blur-dark {
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        background: rgba(10,10,10,0.88) !important;
      }

      /* Divider line */
      .brand-line {
        width: 48px;
        height: 2px;
        background: var(--brand-red);
        display: inline-block;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--brand-red); border-radius: 3px; }

      html { scroll-behavior: smooth; }

      /* Before/after slider */
      .ba-container { position: relative; overflow: hidden; user-select: none; cursor: ew-resize; }
      .ba-after { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
      .ba-handle {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        background: white;
        z-index: 10;
        cursor: ew-resize;
      }
      .ba-handle-btn {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: white;
        box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Page transition */
      .page-transition {
        animation: heroFadeIn 0.4s ease both;
      }

      /* Marquee ticker */
      .marquee-track {
        display: flex;
        white-space: nowrap;
        animation: marquee 25s linear infinite;
      }

      /* Newsletter overlay */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.6);
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: heroFadeIn 0.3s ease;
        backdrop-filter: blur(4px);
      }

      /* Workshop card hover */
      .workshop-card {
        transition: transform 0.35s cubic-bezier(0.16,1,0.3,1), box-shadow 0.35s ease;
      }
      .workshop-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 20px 60px rgba(0,0,0,0.12);
      }

      /* Stitch decoration */
      .stitch-line {
        border-top: 2px dashed rgba(139,26,26,0.3);
      }

      /* Subtle grain texture */
      .grain::after {
        content: '';
        position: absolute;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 1;
      }
    </style>

{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.1/",

    "react": "https://esm.sh/react@^19.2.1"
  }
}
</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
